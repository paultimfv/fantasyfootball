# Rebuilds the pages in public/ with the latest NFL and NHL stats and commits them.
# Vercel redeploys on every push to main, so the site updates itself.
name: Refresh stats

on:
  schedule:
    - cron: "17 13 * * *"  # every morning: NHL plays almost daily, NFL stats land Tue/Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ff site --sport football
      # hockey gets its own step so an NHL API hiccup can't block the football refresh
      - run: python -m ff site --sport hockey
        continue-on-error: true
      - name: Commit if the stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --cached --quiet || { git commit -m "Refresh stats" && git push; }
