# Rebuilds public/index.html with the latest NFL stats and commits it.
# Vercel redeploys on every push to main, so the site updates itself.
name: Refresh stats

on:
  schedule:
    - cron: "17 13 * * 2"  # Tuesdays, after Monday Night Football stats land
    - cron: "17 13 * * 5"  # Fridays, after Thursday Night Football
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ff site
      - name: Commit if the stats changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet || { git commit -m "Refresh stats" && git push; }
